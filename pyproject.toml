[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdoctor"
version = "0.1.0"
description = "Local ASR quantization diagnostics and selective QAT"
requires-python = ">=3.11"

[project.scripts]
quantdoctor = "quantdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["quantdoctor*"]

[tool.setuptools.package-data]
quantdoctor = ["web/*.html", "web/*.js", "web/*.css"]
